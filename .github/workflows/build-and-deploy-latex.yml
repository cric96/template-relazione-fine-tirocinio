name: Build LaTeX and deploy on GitHub Releases
on:
  push:
    tags: '*'
    branches-ignore:
      - 'autodelivery**'
      - 'bump-**'
      - 'renovate/**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:

permissions: { }

jobs:
  success:
    # ubuntu-latest (26.04) breaks the remove-unwanted-software step of the action
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: DanySK/compile-and-publish-all-latex@2.3.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
